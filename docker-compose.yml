services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_ROOT_HOST: "%"
    ports:
      - "3306:3306"
    volumes:
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/bingo.cnf:ro
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  fluentd:
    image: fluent/fluentd:v1.17-debian-1
    ports:
      - "8888:8888"
    volumes:
      - ./docker/fluentd/fluent.conf:/fluentd/etc/fluent.conf:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8888/"]
      interval: 5s
      timeout: 5s
      retries: 10

  bingo:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
      fluentd:
        condition: service_healthy
    command:
      - -h
      - mysql
      - -u
      - bingo
      - -p
      - bingo
      - -d
      - http://fluentd:8888/bingo.data
    restart: on-failure

volumes:
  mysql_data:
